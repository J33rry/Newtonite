<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 320" width="1600" height="320" fill="none" role="img" aria-label="OPSDESK — operational work, coordinated under pressure">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .dash { stroke-dasharray: 1; stroke-dashoffset: 1; animation: dash 1.15s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes dash { to { stroke-dashoffset: 0; } }
    .f { opacity: 0; animation: f .8s ease forwards; }
    @keyframes f { to { opacity: 1; } }
    .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .d1 { animation-delay: .05s } .d3 { animation-delay: .45s } .d4 { animation-delay: .7s } .d5 { animation-delay: .95s }
    .g1 .dash { animation-delay: .06s } .g2 .dash { animation-delay: .24s }
    .rule { animation-duration: 1.3s; animation-delay: .55s }
    .rot { opacity: 0; animation: rot 12s linear infinite; }
    @keyframes rot { 0% {opacity:0} 2% {opacity:1} 21% {opacity:1} 25% {opacity:0} 100% {opacity:0} }
    .r1 { animation-delay: 1.1s } .r2 { animation-delay: 4.1s } .r3 { animation-delay: 7.1s } .r4 { animation-delay: 10.1s }
    @media (prefers-reduced-motion: reduce) {
      .dash, .f, .rise, .rot { animation: none; }
      .dash { stroke-dashoffset: 0; }
      .f, .rise { opacity: 1; transform: none; }
      .rot { opacity: 0; } .rot.r1 { opacity: .85; }
    }
  </style>
  <line class="dash" pathLength="1" x1="46" y1="92" x2="1554" y2="92" stroke="#ffffff" stroke-width="1" opacity="0.28"/>
  <g class="f d1">
    <text class="mono" x="46" y="72" font-size="16" letter-spacing="2.5" fill="#8b949e">~/newtonite/opsdesk</text>
    <text class="mono" x="1554" y="72" text-anchor="end" font-size="16" letter-spacing="2.5" fill="#8b949e">v1 · operations under pressure</text>
  </g>
  <g class="rise d3">
    <text class="mono" x="44" y="186" font-size="72" font-weight="300" letter-spacing="11" fill="#ffffff">OPSDESK</text>
  </g>
  <g class="f d4">
    <text class="mono" x="48" y="230" font-size="19" letter-spacing="4" fill="#8b949e">operational work tracker &#183; claim &#183; approve &#183; resolve</text>
  </g>
  <g class="f d5">
    <text class="mono" x="48" y="272" font-size="14" letter-spacing="1.5" fill="#8b949e">guarantee &#9656;</text>
  </g>
  <text class="mono rot r1" x="168" y="272" font-size="15" letter-spacing="2" fill="#ffffff" opacity="0.85">claim races → exactly one owner</text>
  <text class="mono rot r2" x="168" y="272" font-size="15" letter-spacing="2" fill="#ffffff" opacity="0.85">stale edits → 409, never a lost update</text>
  <text class="mono rot r3" x="168" y="272" font-size="15" letter-spacing="2" fill="#ffffff" opacity="0.85">retries → replayed, never applied twice</text>
  <text class="mono rot r4" x="168" y="272" font-size="15" letter-spacing="2" fill="#ffffff" opacity="0.85">outbox · skip locked · listen/notify</text>
  <line class="dash rule" pathLength="1" x1="46" y1="300" x2="1554" y2="300" stroke="#ffffff" stroke-width="1.5" opacity="0.28" style="animation-delay:.75s;animation-duration:1.4s"/>
</svg>
